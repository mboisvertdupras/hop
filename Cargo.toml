[package]
name = "hop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI for browsing, editing, and connecting to the hosts in ~/.ssh/config"
authors = ["Marc Boisvert-Dupras <marc@tamarak.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mboisvertdupras/hop"
homepage = "https://github.com/mboisvertdupras/hop"
readme = "README.md"
keywords = ["ssh", "ssh-config", "tui", "terminal", "cli"]
categories = ["command-line-utilities", "network-programming"]
publish = false

# publish = false would otherwise hide hop from dist.
[package.metadata.dist]
dist = true

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }  # re-exports crossterm 0.29, so no second pin
ratatui-textarea = "0.9.3"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
glob = "0.3.4"
tempfile = "3.27.0"
rustix = { version = "1.1.5", features = ["fs"] }
signal-hook = "0.4.5"

[profile.dist]
inherits = "release"
lto = "thin"
